<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Code for Youth — Empowering Cambodian youth through world-class tech education.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Code4Youth">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/code.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/code.png"/>

  <title>Code4Youth</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build post-process.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            renderer: "html" // Forces HTML renderer to show images correctly on Web
          }).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
