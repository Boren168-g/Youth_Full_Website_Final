<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Code for Youth — Empowering Cambodian youth through world-class tech education.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Code4Youth">

  <!-- Matching your original orange code icon -->
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2621/2621037.png">

  <!-- Favicon for browser tab -->
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2621/2621037.png"/>

  <title>Code4Youth</title>
  <link rel="manifest" href="manifest.json">

  <script>
    const serviceWorkerVersion = "589634823" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            renderer: "html"
          }).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
